[project]
name = "onyx"
version = "0.1.0"
description = "Mizan: a governed consumer-care AI for a synthetic UAE operator, gated by binding UAE text."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "pypdf>=4.0",
    "matplotlib>=3.9",
    "python-docx>=1.1",
]

# `uv sync` (the README's two-minute check) installs this group; `uv pip install -e ".[dev]"` the extra above
[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "pypdf>=4.0",
    "matplotlib>=3.9",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onyx*"]

[tool.setuptools.package-data]
onyx = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
