# Order 2026-10-17 Task 11 and order 2026-10-21-task-9-fixes-tasks-10-11 item 8: every committed figure and page is
# regenerated from the committed logs and data, and the job fails if any byte differs. No secret, no model call.
name: reproduce

on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      # the README's two-minute check: uv sync, then pytest -q (selftest and replay are run by tests/test_cli.py)
      - run: uv sync
      # No `kb fetch`: it rewrites url_accessed and http_status in kb/manifest.csv, and the checks below run on the
      # committed chunks and extracts. `kb verify` checks the manifest and any source on disk.
      - run: uv run --no-sync python -m onyx kb verify
      - run: uv run --no-sync python -m onyx check-data
      # order 2026-10-29-task-29 Part C2: the datasheet, byte-identical from the manifest and the chunks
      - run: uv run --no-sync python -m onyx kb datasheet
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m onyx selftest
      - name: verify-log on every committed run log
        run: |
          for log in $(git ls-files 'runs/*.jsonl' | grep -v '/gaps/'); do
            uv run --no-sync python -m onyx verify-log "$log" > /dev/null || { echo "chain broken: $log"; exit 1; }
          done
          echo "$(git ls-files 'runs/*.jsonl' | grep -vc '/gaps/') logs: chain ok"
      - name: replay one run per scenario
        run: |
          for s in S1 S2 S3 S4 S5; do uv run --no-sync python -m onyx replay "runs/$s/run1.jsonl"; done
      - run: uv run --no-sync python -m onyx eval
      - run: uv run --no-sync python -m onyx eval --runs runs/scripted --out eval/scripted
      - run: uv run --no-sync python -m onyx gaps
      - run: uv run --no-sync python -m onyx replay-page
      # order 2026-10-29-task-29 Part A: the model-down page, byte-identical from the recorded S2 run
      - run: uv run --no-sync python -m onyx model-down runs/c5/S2/run1.jsonl --at 3
      - run: uv run --no-sync python -m onyx replay-page --html
      # order 2026-10-23-task-12-report-build: the report, built before the figures are redrawn, so it embeds the
      # committed PNGs and stays byte-identical across machines; the value check fails the step on a wrong figure
      - run: uv run --no-sync python docs/build_report.py
      # order 2026-10-22-task-17-figures: Figure 1 and Figure 2, redrawn from the README table and eval/results.md
      - run: uv run --no-sync python scripts/fig_architecture.py
      - run: uv run --no-sync python scripts/fig_results.py
      # order 2026-10-25-task-25-site: the site pages, regenerated byte for byte from the committed data
      - run: uv run --no-sync python -m onyx site
      - run: git diff --exit-code -- docs/site/
      # ruling 4 (hq, 2026-10-22): the figure PNGs differ by machine; the SVGs carry the cross-machine byte check
      - run: git diff --exit-code -- . ':(exclude)docs/fig/*.png'
